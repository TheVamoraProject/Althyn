[package]
name = "vamora-statusbar"
version = "0.5.0"
edition = "2024"

[dependencies]
cxx = "1.0.197"
cxx-qt = "0.9.1"
cxx-qt-lib = { version = "0.9.1", features = ["qt_gui", "qt_qml"] }
# X11-only for now (pre-alpha targets Openbox): used to reserve screen space
# via EWMH struts so maximized windows don't sit under the status bar.
x11rb = "0.13"

[build-dependencies]
cxx-qt-build = "0.9.1"